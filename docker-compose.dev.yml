# Local dev dependencies (PRD §24.2). Default: run the app on the host (`pnpm migrate` then `pnpm dev`).
# Production-like app in Docker: [`docker-compose.docker-app.yml`](docker-compose.docker-app.yml) + `pnpm docker:app`.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Jackson (optional — Better Auth SAML does not require it):
#   docker compose -f docker-compose.dev.yml --profile jackson up -d
#
# Self-hosted PostHog is multi-service; use PostHog Cloud or follow:
# https://posthog.com/docs/self-host/deploy/docker — see README Testing / Analytics.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blank_saas
    volumes:
      - blank_saas_pg:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blank_saas"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  svix:
    image: svix/svix-server:latest
    restart: unless-stopped
    ports:
      - "8071:8071"
    environment:
      WAIT_FOR: "true"
      SVIX_REDIS_DSN: redis://redis:6379
      SVIX_DB_DSN: postgresql://postgres:postgres@postgres:5432/svix
      SVIX_JWT_SECRET: ${SVIX_JWT_SECRET:-dev-svix-jwt-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - blank_saas_minio:/data

  jackson:
    profiles: ["jackson"]
    image: boxyhq/jackson:latest
    restart: unless-stopped
    ports:
      - "5225:5225"
    environment:
      DB_ENGINE: sql
      DB_TYPE: postgres
      DB_URL: postgresql://postgres:postgres@postgres:5432/blank_saas
      DB_SSL: "false"
      HOST: "0.0.0.0"
      PORT: "5225"
      NEXTAUTH_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-change-me}
      JACKSON_API_KEY: ${JACKSON_API_KEY:-dev-jackson-api-key}
      PRODUCT: ${JACKSON_PRODUCT:-starter}
      SAML_AUDIENCE: ${SAML_AUDIENCE:-http://localhost:5225}
      PUBLIC_HOST_URL: ${JACKSON_PUBLIC_HOST_URL:-http://localhost:5225}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  blank_saas_pg:
  blank_saas_minio:
